<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #15171a; --card: #1f2125; --line: #2e3238;
    --text: #e8e8ea; --dim: #9aa0a8; --key: #ffd400; --accent: #ff8a00;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --card: #fff; --line: #e2e4e8; --text: #1f2125; --dim: #6b7079; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, sans-serif; display: flex; flex-direction: column;
    align-items: center; padding: 6vh 20px 40px; gap: 26px; }
  .logo { width: 210px; max-width: 70vw; }
  .lead { margin: 0; color: var(--dim); text-align: center; }
  kbd { background: var(--key); color: #1f2125; border-radius: 4px; padding: 1px 6px;
    font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  section { width: 100%; max-width: 760px; }
  h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--dim); font-weight: 600; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  a.tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none;
    overflow: hidden; }
  a.tile:hover { border-color: var(--accent); }
  .mark { width: 26px; height: 26px; flex: none; border-radius: 6px; background: var(--accent);
    color: #1f2125; display: flex; align-items: center; justify-content: center;
    font: 700 13px/1 system-ui, sans-serif; text-transform: uppercase; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--dim); font-size: 13px; margin: 0; }
  footer { margin-top: auto; padding-top: 24px; color: var(--dim); font-size: 13px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    background: var(--card); color: inherit; border: 1px solid var(--line); }
  button:hover { border-color: var(--accent); }
  #homeState { color: var(--dim); }
</style>
</head>
<body>
  <img class="logo" src="icons/icon.svg" alt="UOKey">
  <p class="lead">Press <kbd>Ctrl</kbd> <kbd>Space</kbd> to find anything on a page,
    or type <kbd>!marks</kbd> in the bar to find a bookmark.</p>

  <section>
    <h2>Most visited</h2>
    <div class="grid" id="sites"><p class="empty">Nothing yet.</p></div>
  </section>

  <section>
    <h2>Bookmarks toolbar</h2>
    <div class="grid" id="marks"><p class="empty">Nothing on your bookmarks toolbar.</p></div>
  </section>

  <footer>
    <span id="homeState">Checking your home page…</span>
  </footer>

  <script src="newtab.js"></script>
  <script src="content.js"></script>
</body>
</html>
